[project]
name = "rift-staples-backend"
version = "0.1.0"
description = ""
authors = [
    {name = "Vincent Jiang",email = "vincejiang1996@gmail.com"}
]
requires-python = ">=3.14"
dependencies = [
    "requests (>=2.34.2,<3.0.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "boto3 (>=1.43.76,<2.0.0)"
]

[tool.poetry]
packages = [
    { include = "ingestion", from="./lambdas" },
    { include = "shared", from="./lambdas" },
    { include = "core", from="./lambdas" }
]

[dependency-groups]
dev = [
    "black (>=26.5.1,<27.0.0)",
    "boto3-stubs[dynamodb] (>=1.43.76,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
