name: Deploy to AWS Lambda

on:
  push:
    branches: [ "main" ]

permissions:
  id-token: write   # This is required for OIDC authentication
  contents: read    # This is required to checkout the repository


jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production

    # Sets the default directory for all 'run' steps in this job
    defaults:
      run:
        working-directory: apps/backend

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Debug GitHub OIDC claims
      uses: actions/github-script@v8
      with:
        script: |
          const token = await github.rest.actions.getIDToken({
            audience: 'sts.amazonaws.com'
          })

          const payload = JSON.parse(
            Buffer.from(token.data.split('.')[1], 'base64url').toString()
          )

          console.log(JSON.stringify({
            iss: payload.iss,
            aud: payload.aud,
            sub: payload.sub,
            repository: payload.repository,
            repository_id: payload.repository_id,
            repository_owner: payload.repository_owner,
            repository_owner_id: payload.repository_owner_id,
            ref: payload.ref,
            environment: payload.environment,
            workflow: payload.workflow
          }, null, 2))

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::258491186884:role/github-actions-deploy-role
        aws-region: us-east-1
        # The role-to-assume should be the ARN of the IAM role you created for GitHub Actions OIDC

    - name: Create Python zip
      run: |
          # Create a clean build directory
          mkdir artifact
          
          # Install requirements directly into the artifact directory
          pip install -r requirements.txt -t ./artifact/python

          # Copy and build lambda zip
          cp -R ./app/lambda/ ./artifact/ 

    - name: Deploy Lambda Function
      uses: aws-actions/aws-lambda-deploy@v1.1.0
      with:
        function-name: just-tcg-pricing
        code-artifacts-dir: ./artifact
        handler: index.handler
        runtime: python3.14
        # Add any additional inputs this action supports
