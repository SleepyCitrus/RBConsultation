name: Deploy to AWS Lambda

on:
  push:
    branches: [ "main" ]

permissions:
  id-token: write   # This is required for OIDC authentication
  contents: read    # This is required to checkout the repository


jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production

    # Sets the default directory for all 'run' steps in this job
    defaults:
      run:
        working-directory: apps/backend

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::258491186884:role/github-actions-deploy-role
        aws-region: us-east-1
        # The role-to-assume should be the ARN of the IAM role you created for GitHub Actions OIDC

    - name: Create Python zip
      run: |
        # Create a clean build directory
        rm -rf artifact
        mkdir artifact
        
        # Install requirements directly into the artifact directory
        pip install -r requirements.txt -t ./artifact

        # Copy and build lambda zip
        cp -R ./app/lambda/. ./artifact/ 

        echo "Artifact contents:"
        find ./artifact -maxdepth 2 -type f | sort

    - name: Deploy Lambda Function
      uses: aws-actions/aws-lambda-deploy@v1.1.0
      with:
        function-name: just-tcg-pricing
        code-artifacts-dir: apps/backend/artifact
        handler: index.handler
        runtime: python3.14
