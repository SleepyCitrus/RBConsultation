name: Deploy to AWS Lambda

on:
  push:
    branches: [ "main" ]

permissions:
  id-token: write   # This is required for OIDC authentication
  contents: read    # This is required to checkout the repository


jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production

    # Sets the default directory for all 'run' steps in this job
    defaults:
      run:
        working-directory: apps/backend

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::258491186884:role/github-actions-deploy-role
        aws-region: us-west-1
        # The role-to-assume should be the ARN of the IAM role you created for GitHub Actions OIDC

    - name: Create Python zip
      run: |
        # Create a clean build directory
        rm -rf artifact
        mkdir -p artifact

        cp -R ./ingestion/lambdas/. ./artifact/
        
        # Install requirements directly into the artifact directory
        docker run --rm \
          --platform linux/amd64 \
          --entrypoint /bin/bash \
          -v "$PWD/apps/backend/ingestion:/src:ro" \
          -v "$PWD/artifact:/var/task" \
          -w /src \
          public.ecr.aws/lambda/python:3.14 \
          -c '
            pip install --no-cache-dir poetry &&
            poetry self add poetry-plugin-export &&
            poetry export --format requirements.txt --without-hashes |
              pip install --no-cache-dir -r /dev/stdin -t /var/task
          '

        rm -rf artifact/__pycache__
        find artifact -name ".DS_Store" -delete

    - name: Deploy Lambda Function
      uses: aws-actions/aws-lambda-deploy@v1.1.0
      with:
        function-name: just-tcg-pricing
        code-artifacts-dir: apps/backend/artifact
        handler: lambda_function.lambda_handler
        runtime: python3.14
        environment: '{"JUSTTCG_API_KEY": "${{ secrets.JUSTTCG_API_KEY }}"}'
        timeout: 120
