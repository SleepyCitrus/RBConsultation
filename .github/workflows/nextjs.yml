# Sample workflow for building and deploying a Next.js site to GitHub Pages
#
# To get started with Next.js see: https://nextjs.org/docs/getting-started
#
name: Deploy Next.js site to GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        working-directory: apps/frontend
        run: npm ci

      - name: Check Next.js config
        working-directory: apps/frontend
        run: |
          echo "PWD:"
          pwd

          echo "FILES:"
          ls -la

          echo "NEXT CONFIG:"
          cat next.config.ts

      - name: Build Next.js
        working-directory: apps/frontend
        run: npm run build

      - name: Verify static export
        working-directory: apps/frontend
        run: |
          echo "Generated files:"
          find out -maxdepth 2 -type f | head -50

          echo "Checking for basePath:"
          grep -R 'RBConsultation' out | head -30 || true

          echo "Checking for BAD root asset URLs:"
          grep -R 'href="/_next' out | head -30 || true

          echo "Checking for BAD root routes:"
          grep -R 'href="/cards' out | head -30 || true

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/frontend/out

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4